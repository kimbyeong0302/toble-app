<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토블 관리자 — 학자노트 편집</title>
<script>
// 디버그 계측 — 스크립트가 어디서든 조용히 죽으면(리소스 로드 실패 포함) 그 에러를
// 화면에 그대로 보여준다. admin.html 주소 끝에 ?debug=1을 붙였을 때만 화면에 뜨고,
// 평소에는 완전히 안 보인다(등록 자체는 항상 해두되 표시만 게이트한다).
window.__tobleDebug = new URLSearchParams(location.search).has('debug');
window.__tobleErrorLog = [];
function tobleShowDebugError(label, detail) {
  window.__tobleErrorLog.push('[' + label + '] ' + detail);
  if (!window.__tobleDebug) return;
  var box = document.getElementById('debug-error-box');
  if (box) { box.style.display = 'block'; box.textContent = window.__tobleErrorLog.join('\n\n'); }
}
window.addEventListener('error', function (e) {
  if (e.target && e.target !== window && e.target.tagName) {
    tobleShowDebugError('리소스 로드 실패', (e.target.src || e.target.href || e.target.tagName) + '');
    return;
  }
  tobleShowDebugError('JS 에러', (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + (e.error && e.error.stack ? '\n' + e.error.stack : ''));
}, true);
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  tobleShowDebugError('처리 안 된 Promise 거부', (r && r.message) ? r.message + (r.stack ? '\n' + r.stack : '') : String(r));
});
document.addEventListener('DOMContentLoaded', function () {
  // body가 생기기 전(head 파싱 중)에 이미 잡힌 에러가 있으면, 이제 실제로 박스에 그려준다.
  if (window.__tobleDebug && window.__tobleErrorLog.length) {
    var box = document.getElementById('debug-error-box');
    if (box) { box.style.display = 'block'; box.textContent = window.__tobleErrorLog.join('\n\n'); }
  }
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha256-7ABBdtEBrsd67vJmqhyUQRKH/iA5xl6l9scvXhSzhH0=" crossorigin="anonymous" onerror="window.__sbLoadFailed = true;"></script>
<style>
  :root { --bg:#faf9f6; --card:#fff; --ink:#1c2733; --ink-soft:#5b6774; --line:#e4e0d8; --accent:#8a6d3b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans KR', system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 24px 20px 80px; }
  .back-link { display: inline-block; font-size: 13px; color: var(--ink-soft); text-decoration: none; margin-bottom: 12px; }
  .back-link:active { color: var(--accent); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--ink-soft); font-size: 13px; margin-bottom: 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .gate { text-align: center; padding: 60px 20px; color: var(--ink-soft); }
  .gate a { color: var(--accent); }
  select, input[type="number"] { font-size: 15px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom: 8px; }
  .verse-row { display:flex; gap:10px; align-items:flex-start; padding:10px 8px; border-bottom:1px solid var(--line); cursor:pointer; }
  .verse-row:hover { background: #f3f1ea; }
  .verse-row.active { background: #efe8d8; }
  .verse-num { flex: 0 0 34px; font-weight:700; color:var(--accent); }
  .verse-text { flex:1; font-size:14px; line-height:1.5; }
  .verse-badge { flex: 0 0 auto; font-size:11px; padding:2px 8px; border-radius:999px; }
  .badge-has { background:#e5efe6; color:#3a6b45; }
  .badge-none { background:#f0eee7; color:var(--ink-soft); }
  .form-field { margin-bottom: 12px; }
  .form-field label { display:block; font-size:12px; color:var(--ink-soft); margin-bottom:4px; }
  .form-field input, .form-field textarea { width:100%; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-family:inherit; background:var(--bg); color:var(--ink); }
  .form-field textarea { min-height: 70px; resize: vertical; }
  .btn { font-size:14px; padding:9px 16px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; }
  .btn.secondary { background: transparent; color: var(--accent); }
  .status-msg { font-size:12px; color:var(--ink-soft); margin-top:8px; min-height: 16px; }
  .status-msg.error { color: #b0552f; }
  .status-msg.ok { color: #3a6b45; }
  #admin-app { display: none; }
  .nav-tabs { display:flex; gap:8px; margin-bottom:16px; }
  .nav-tab { font-size:14px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); cursor:pointer; }
  .nav-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .user-row-wrap { border-bottom:1px solid var(--line); }
  .user-row { display:flex; gap:10px; align-items:center; padding:10px 8px; flex-wrap:wrap; }
  .user-email { flex:1 1 auto; font-size:14px; min-width:160px; }
  .user-joined { font-size:11px; color:var(--ink-soft); flex:0 0 auto; }
  .role-tag { font-size:11px; padding:2px 8px; border-radius:999px; background:#f0eee7; color:var(--ink-soft); }
  .role-tag.role-admin { background:#e5efe6; color:#3a6b45; }
  .role-tag.role-owner { background:#f3e6d8; color:var(--accent); }
  .sub-tag { font-size:11px; padding:2px 8px; border-radius:999px; background:#f0eee7; color:var(--ink-soft); }
  .sub-tag.sub-active { background:#e5efe6; color:#3a6b45; }
  .sub-tag.sub-expired { background:#f3e6d8; color:#8a6d3b; }
  .sub-tag.sub-cancelled { background:#f5e6e6; color:#b0552f; }
  .sub-edit-form { padding:4px 8px 16px; }
  .sub-edit-form .row label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--ink-soft); }
  .sub-only-filter-row { display:flex; align-items:center; gap:6px; font-size:13px; color:var(--ink-soft); margin-bottom:10px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back-link">← 메인 화면으로 돌아가기</a>
  <h1>토블 관리자 — 학자노트 편집</h1>
  <div class="sub">notes 테이블을 직접 편집합니다. 관리자 계정으로 로그인해야 접근할 수 있습니다.</div>

  <div id="debug-error-box" style="display:none; background:#fee; color:#900; padding:12px; margin-bottom:16px; border:1px solid #c00; border-radius:8px; font-family:monospace; font-size:12px; white-space:pre-wrap; word-break:break-all;"></div>

  <div id="gate" class="gate">확인 중...</div>

  <div id="admin-app">
    <div class="card">
      <div class="row">
        <span id="signed-in-as" class="sub" style="margin-right:auto;"></span>
        <button class="btn secondary" id="admin-logout-btn">로그아웃</button>
      </div>
    </div>

    <div class="nav-tabs" id="nav-tabs" style="display:none;">
      <button class="nav-tab active" id="nav-notes-btn">학자노트 편집</button>
      <button class="nav-tab" id="nav-users-btn">사용자 관리</button>
    </div>

    <div id="notes-view">
      <div class="card">
        <div class="row">
          <label>책 <select id="book-select"></select></label>
          <label>장 <select id="chapter-select"></select></label>
        </div>
      </div>

      <div class="card" id="verse-list-card">
        <div id="verse-list"></div>
      </div>

      <div class="card" id="edit-card" style="display:none;">
      <div class="sub" id="edit-ref"></div>
      <div class="form-field">
        <label>제목</label>
        <input type="text" id="f-title">
      </div>
      <div class="form-field">
        <label>본문</label>
        <textarea id="f-body"></textarea>
      </div>
      <div class="form-field">
        <label>문법노트</label>
        <textarea id="f-grammar"></textarea>
      </div>
      <div class="form-field">
        <label>참고구절 (예: 마태복음 16:21, 20:19)</label>
        <input type="text" id="f-refs">
      </div>
      <div class="form-field">
        <label>출처</label>
        <input type="text" id="f-src">
      </div>
      <button class="btn" id="save-btn">저장</button>
      <button class="btn secondary" id="cancel-btn">닫기</button>
      <div class="status-msg" id="save-status"></div>
      </div>
    </div>

    <div class="card" id="user-mgmt-view" style="display:none;">
      <div class="row">
        <input type="email" id="user-search-input" placeholder="이메일로 검색 (비워두고 검색하면 전체 목록)" style="flex:1; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:8px;">
        <button class="btn" id="user-search-btn">검색</button>
      </div>
      <label class="sub-only-filter-row">
        <input type="checkbox" id="sub-only-filter"> 구독중만 보기
      </label>
      <div id="user-search-results" class="sub">이메일을 입력하거나, 비워둔 채로 검색하면 전체 목록이 나옵니다.</div>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://tepsuxyfyrkylyhsngwo.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRlcHN1eHlmeXJreWx5aHNuZ3dvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1MTk3ODgsImV4cCI6MjEwMzA5NTc4OH0.tRCXepurFgWt_hSVuSnzhCFxzcj8qJdGwm6QGGIt96Q';
// supabase-js CDN 스크립트가 (네트워크 문제 등으로) 못 불러와지면 supabase 전역이 아예 없다 —
// 그 상태에서 바로 createClient를 부르면 스크립트 전체가 죽어서 "확인 중..." 문구만 뜨고
// 그 뒤로 아무 것도 안 그려지는(로그인 폼도 안 뜨는) 화면이 된다. index.html과 같은 방식으로 가드한다.
const sb = (!window.__sbLoadFailed && typeof supabase !== 'undefined')
  ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

let currentUser = null;
let currentRole = 'user';
let books = [];
let currentBookId = null;
let currentChapter = 1;
let notesByVerse = {}; // verse(int) -> note row

function showGate(html) {
  document.getElementById('gate').innerHTML = html;
  document.getElementById('gate').style.display = '';
  document.getElementById('admin-app').style.display = 'none';
}

// sb.auth.getSession()이나 테이블 조회가 네트워크 문제로 응답 없이 멈춰버리면 checkAccess()가
// 영원히 안 끝나서 "확인 중..." 화면에 갇힌다 — 일정 시간 안에 안 끝나면 타임아웃 에러로 대신 처리한다.
function withTimeout(promise, ms, label) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' 응답이 없습니다 (연결을 확인해주세요)')), ms)),
  ]);
}

function showLoginForm(message) {
  showGate(`
    ${message ? `<div class="sub" style="margin-bottom:14px;">${message}</div>` : ''}
    <div class="form-field" style="max-width:280px; margin:0 auto 12px;">
      <label>관리자 이메일</label>
      <input type="email" id="admin-login-email" autocomplete="username">
    </div>
    <div class="form-field" style="max-width:280px; margin:0 auto 12px;">
      <label>비밀번호</label>
      <input type="password" id="admin-login-password" autocomplete="current-password">
    </div>
    <button class="btn" id="admin-login-btn">로그인</button>
    <div class="status-msg" id="admin-login-status" style="text-align:center;"></div>
  `);
  const submit = async () => {
    const email = document.getElementById('admin-login-email').value.trim();
    const password = document.getElementById('admin-login-password').value;
    const statusEl = document.getElementById('admin-login-status');
    if (!email || !password) { statusEl.textContent = '이메일과 비밀번호를 입력해주세요.'; statusEl.className = 'status-msg error'; return; }
    statusEl.textContent = '로그인 중...';
    statusEl.className = 'status-msg';
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { statusEl.textContent = error.message; statusEl.className = 'status-msg error'; return; }
    checkAccess();
  };
  document.getElementById('admin-login-btn').addEventListener('click', submit);
  document.getElementById('admin-login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
}

function showFatalError(message) {
  showGate(
    '<div class="sub" style="margin-bottom:14px;">' + escapeHtml(message) + '</div>' +
    '<button class="btn" id="admin-retry-btn">다시 시도</button>'
  );
  const retryBtn = document.getElementById('admin-retry-btn');
  if (retryBtn) retryBtn.addEventListener('click', checkAccess);
}

async function checkAccess() {
  if (!sb) {
    showFatalError('필요한 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    return;
  }
  // 아래에서 무엇이 실패하거나(네트워크 에러) 응답 없이 멈추더라도(withTimeout) "확인 중..." 화면에
  // 영원히 갇히지 않고 항상 에러 메시지 + 다시 시도 버튼이 뜨도록 전체를 try/catch로 감싼다.
  try {
    const { data: { session } } = await withTimeout(sb.auth.getSession(), 10000, '세션 확인');
    currentUser = session ? session.user : null;
    if (!currentUser) {
      showLoginForm();
      return;
    }
    const { data, error } = await withTimeout(
      sb.from('profiles').select('role').eq('id', currentUser.id).maybeSingle(),
      10000, '권한 조회'
    );
    currentRole = (data && data.role) || 'user';
    if (error || (currentRole !== 'admin' && currentRole !== 'owner')) {
      showGate('관리자 권한이 없습니다. <a href="#" id="admin-signout-link">다른 계정으로 로그인</a>');
      const link = document.getElementById('admin-signout-link');
      if (link) link.addEventListener('click', async (e) => { e.preventDefault(); await sb.auth.signOut(); checkAccess(); });
      return;
    }
    // 관리 화면이 이미 다 채워진 채로 한 번에 나타나도록, book/장/절 목록을 먼저 불러온 다음에
    // 화면을 보여준다(중간에 빈 화면이 잠깐 보이지 않도록).
    await withTimeout(loadBooks(), 15000, '책 목록 로딩');
    document.getElementById('signed-in-as').textContent = currentUser.email + ' (' + (currentRole === 'owner' ? '소유자' : '관리자') + ')';
    document.getElementById('nav-tabs').style.display = currentRole === 'owner' ? '' : 'none';
    showNotesView();
    document.getElementById('gate').style.display = 'none';
    // #admin-app의 기본 CSS가 display:none이라, 인라인 스타일을 그냥 비우면(clear) 다시
    // 스타일시트 기본값(none)으로 되돌아가 버려서 절대 안 보였다 — 실제 원인이 이거였다.
    // "" 대신 명시적으로 'block'을 지정해야 진짜로 보인다.
    document.getElementById('admin-app').style.display = 'block';
  } catch (e) {
    showFatalError((e && e.message) ? e.message : '알 수 없는 오류가 발생했습니다.');
  }
}

function showNotesView() {
  document.getElementById('nav-notes-btn').classList.add('active');
  document.getElementById('nav-users-btn').classList.remove('active');
  document.getElementById('notes-view').style.display = '';
  document.getElementById('user-mgmt-view').style.display = 'none';
}
function showUserMgmtView() {
  document.getElementById('nav-notes-btn').classList.remove('active');
  document.getElementById('nav-users-btn').classList.add('active');
  document.getElementById('notes-view').style.display = 'none';
  document.getElementById('user-mgmt-view').style.display = '';
}
document.getElementById('nav-notes-btn').addEventListener('click', showNotesView);
document.getElementById('nav-users-btn').addEventListener('click', showUserMgmtView);

async function loadBooks() {
  const { data, error } = await sb.from('books').select('*').eq('available', true).order('order_num');
  if (error || !data || data.length === 0) {
    showGate('책 목록을 불러오지 못했습니다: ' + (error ? error.message : '데이터 없음'));
    return;
  }
  books = data;
  const sel = document.getElementById('book-select');
  sel.innerHTML = books.map((b) => `<option value="${b.id}">${b.name_ko}</option>`).join('');
  sel.addEventListener('change', () => { currentBookId = sel.value; populateChapters(); loadChapter(); });
  currentBookId = books[0].id;
  populateChapters();
  await loadChapter();
}

function populateChapters() {
  const book = books.find((b) => b.id === currentBookId);
  const sel = document.getElementById('chapter-select');
  const total = book ? book.chapter_count : 1;
  const opts = [];
  for (let c = 1; c <= total; c++) opts.push(`<option value="${c}">${c}장</option>`);
  sel.innerHTML = opts.join('');
  sel.onchange = () => { currentChapter = parseInt(sel.value, 10); loadChapter(); };
  currentChapter = 1;
  sel.value = '1';
}

async function loadChapter() {
  const listEl = document.getElementById('verse-list');
  listEl.innerHTML = '불러오는 중...';
  closeEditForm();

  const [{ data: verses, error: vErr }, { data: notes, error: nErr }] = await Promise.all([
    sb.from('verses').select('verse,text').eq('book_id', currentBookId).eq('translation_id', 'krv').eq('chapter', currentChapter).order('verse'),
    sb.from('notes').select('*').eq('book_id', currentBookId).eq('chapter', currentChapter),
  ]);
  if (vErr || nErr) {
    listEl.innerHTML = '불러오기 실패: ' + ((vErr || nErr).message);
    return;
  }

  notesByVerse = {};
  (notes || []).forEach((n) => { notesByVerse[n.verse_start] = n; });

  if (!verses || verses.length === 0) {
    listEl.innerHTML = '<div class="sub">이 장에는 본문이 없습니다.</div>';
    return;
  }

  listEl.innerHTML = '';
  verses.forEach((v) => {
    const note = notesByVerse[v.verse];
    const row = document.createElement('div');
    row.className = 'verse-row';
    row.dataset.verse = v.verse;
    row.innerHTML = `
      <div class="verse-num">${v.verse}</div>
      <div class="verse-text">${note ? '<strong>' + escapeHtml(note.title || '(제목 없음)') + '</strong><br>' : ''}${escapeHtml(v.text)}</div>
      <div class="verse-badge ${note ? 'badge-has' : 'badge-none'}">${note ? '노트 있음' : '노트 없음'}</div>
    `;
    row.addEventListener('click', () => openEditForm(v.verse, note));
    listEl.appendChild(row);
  });
}

function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function openEditForm(verse, note) {
  document.querySelectorAll('.verse-row').forEach((r) => r.classList.toggle('active', Number(r.dataset.verse) === verse));
  const book = books.find((b) => b.id === currentBookId);
  document.getElementById('edit-ref').textContent = (book ? book.name_ko : currentBookId) + ' ' + currentChapter + ':' + verse + (note ? ' (기존 노트 수정)' : ' (새 노트 추가)');
  document.getElementById('f-title').value = note ? (note.title || '') : '';
  document.getElementById('f-body').value = note ? (note.body || '') : '';
  document.getElementById('f-grammar').value = note ? (note.grammar_note || '') : '';
  document.getElementById('f-refs').value = note ? (note.refs || '') : '';
  document.getElementById('f-src').value = note ? (note.src || '') : '';
  document.getElementById('save-status').textContent = '';
  document.getElementById('save-status').className = 'status-msg';
  document.getElementById('edit-card').style.display = '';
  document.getElementById('edit-card').dataset.verse = verse;
  document.getElementById('edit-card').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeEditForm() {
  document.getElementById('edit-card').style.display = 'none';
  document.querySelectorAll('.verse-row').forEach((r) => r.classList.remove('active'));
}

async function saveNote() {
  const verse = parseInt(document.getElementById('edit-card').dataset.verse, 10);
  const body = document.getElementById('f-body').value.trim();
  const statusEl = document.getElementById('save-status');
  if (!body) { statusEl.textContent = '본문은 비워둘 수 없습니다.'; statusEl.className = 'status-msg error'; return; }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  statusEl.textContent = '저장 중...';
  statusEl.className = 'status-msg';

  const row = {
    book_id: currentBookId,
    chapter: currentChapter,
    verse_start: verse,
    verse_end: verse,
    title: document.getElementById('f-title').value.trim() || null,
    body,
    grammar_note: document.getElementById('f-grammar').value.trim() || null,
    refs: document.getElementById('f-refs').value.trim() || null,
    src: document.getElementById('f-src').value.trim() || null,
  };

  const { error } = await sb.from('notes').upsert(row, { onConflict: 'book_id,chapter,verse_start,verse_end' });
  saveBtn.disabled = false;
  if (error) {
    statusEl.textContent = '저장 실패: ' + error.message;
    statusEl.className = 'status-msg error';
    return;
  }
  await loadChapter(); // 목록을 새로 그리며 closeEditForm()이 먼저 호출됨
  openEditForm(verse, notesByVerse[verse]); // openEditForm이 상태 메시지를 지우므로, 그 다음에 메시지를 넣는다
  document.getElementById('save-status').textContent = '저장 완료.';
  document.getElementById('save-status').className = 'status-msg ok';
}

document.getElementById('save-btn').addEventListener('click', saveNote);
document.getElementById('cancel-btn').addEventListener('click', closeEditForm);
document.getElementById('admin-logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); checkAccess(); });

// ============================================================
// 사용자 관리 (owner 전용) — 이메일로 검색(비우면 전체 목록, 최대 200명)해서 role과
// 구독 상태를 관리한다. 검색은 auth.users를 봐야 해서 RPC(admin_search_users)를 쓰고,
// role/구독 변경은 profiles를 직접 update하되 실제 허용 여부는 전적으로 RLS(owner만)가
// 결정한다. "구독중만 보기"는 이미 불러온 목록을 화면에서만 걸러내는 것이라 재검색은 안 한다.
// ============================================================
let lastSearchedUsers = [];

function subStatusLabel(status) {
  return { none: '없음', active: '구독중', expired: '만료', cancelled: '해지' }[status] || status;
}
function formatShortDate(iso) {
  return iso ? iso.slice(0, 10) : '-';
}

async function searchUsers() {
  const q = document.getElementById('user-search-input').value.trim();
  const resultsEl = document.getElementById('user-search-results');
  resultsEl.textContent = '검색 중...';
  const { data, error } = await sb.rpc('admin_search_users', { search_email: q });
  if (error) { resultsEl.textContent = '검색 실패: ' + error.message; lastSearchedUsers = []; return; }
  lastSearchedUsers = data || [];
  renderUserResults();
}

function renderUserResults() {
  const resultsEl = document.getElementById('user-search-results');
  const subOnly = document.getElementById('sub-only-filter').checked;
  const list = subOnly ? lastSearchedUsers.filter((r) => r.out_subscription_status === 'active') : lastSearchedUsers;
  if (list.length === 0) {
    resultsEl.textContent = subOnly ? '구독중인 사용자가 없습니다.' : '일치하는 사용자가 없습니다.';
    return;
  }

  resultsEl.innerHTML = '';
  list.forEach((row0) => {
    // RPC 리턴 컬럼명(out_*) 그대로 노출하지 않고 여기서만 정리
    const u = {
      id: row0.out_id, email: row0.out_email, role: row0.out_role, createdAt: row0.out_created_at,
      subStatus: row0.out_subscription_status || 'none',
      subStarted: row0.out_subscription_started_at,
      subExpires: row0.out_subscription_expires_at,
      subNote: row0.out_subscription_note || '',
    };
    const roleLabel = u.role === 'owner' ? '소유자' : (u.role === 'admin' ? '관리자' : '일반');
    let roleActionsHtml = '';
    if (u.role === 'owner') {
      roleActionsHtml = '<span class="sub">(소유자는 이 화면에서 변경할 수 없습니다)</span>';
    } else if (u.role === 'admin') {
      roleActionsHtml = `<button class="btn secondary" data-uid="${u.id}" data-role="user">일반으로 변경</button>`;
    } else {
      roleActionsHtml = `<button class="btn secondary" data-uid="${u.id}" data-role="admin">관리자로 승격</button>`;
    }

    const wrap = document.createElement('div');
    wrap.className = 'user-row-wrap';
    wrap.innerHTML = `
      <div class="user-row">
        <span class="user-email">${escapeHtml(u.email)}</span>
        <span class="user-joined">${formatShortDate(u.createdAt)} 가입</span>
        <span class="role-tag role-${u.role}">${roleLabel}</span>
        <span class="sub-tag sub-${u.subStatus}">${subStatusLabel(u.subStatus)}</span>
        ${roleActionsHtml}
        <button class="btn secondary sub-toggle-btn" data-uid="${u.id}">구독 관리</button>
      </div>
      <div class="sub-edit-form" id="sub-edit-${u.id}" style="display:none;">
        <div class="row">
          <label>상태
            <select class="sub-status-select">
              <option value="none">없음</option>
              <option value="active">구독중</option>
              <option value="expired">만료</option>
              <option value="cancelled">해지</option>
            </select>
          </label>
          <label>시작일 <input type="date" class="sub-started-input"></label>
          <label>만료일 <input type="date" class="sub-expires-input"></label>
        </div>
        <div class="form-field">
          <label>메모</label>
          <input type="text" class="sub-note-input" placeholder="예: 베타 무료">
        </div>
        <button class="btn sub-save-btn" data-uid="${u.id}">저장</button>
        <div class="status-msg sub-save-status"></div>
      </div>
    `;
    wrap.querySelector('.sub-status-select').value = u.subStatus;
    wrap.querySelector('.sub-started-input').value = u.subStarted ? u.subStarted.slice(0, 10) : '';
    wrap.querySelector('.sub-expires-input').value = u.subExpires ? u.subExpires.slice(0, 10) : '';
    wrap.querySelector('.sub-note-input').value = u.subNote;
    resultsEl.appendChild(wrap);
  });

  resultsEl.querySelectorAll('button[data-uid][data-role]').forEach((btn) => {
    btn.addEventListener('click', () => changeUserRole(btn.dataset.uid, btn.dataset.role));
  });
  resultsEl.querySelectorAll('.sub-toggle-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      const form = document.getElementById('sub-edit-' + btn.dataset.uid);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    });
  });
  resultsEl.querySelectorAll('.sub-save-btn').forEach((btn) => {
    btn.addEventListener('click', () => saveSubscription(btn.dataset.uid));
  });
}

async function changeUserRole(uid, newRole) {
  // .select()를 붙여서 실제로 바뀐 행을 돌려받는다 — RLS가 막으면 에러 없이 그냥 0행이 되므로,
  // error만 보면 "막혔는데 성공한 것처럼" 보일 수 있어서 행 개수까지 확인한다.
  const { data, error } = await sb.from('profiles').update({ role: newRole }).eq('id', uid).select();
  if (error) {
    alert('role 변경 실패: ' + error.message);
    return;
  }
  if (!data || data.length === 0) {
    alert('role이 변경되지 않았습니다 (권한이 없어 막혔을 수 있습니다).');
    return;
  }
  await searchUsers(); // 목록을 새로 불러와서 바뀐 상태를 바로 보여줌
}

async function saveSubscription(uid) {
  const form = document.getElementById('sub-edit-' + uid);
  const statusEl = form.querySelector('.sub-save-status');
  const status = form.querySelector('.sub-status-select').value;
  const startedVal = form.querySelector('.sub-started-input').value;
  const expiresVal = form.querySelector('.sub-expires-input').value;
  const note = form.querySelector('.sub-note-input').value.trim();
  statusEl.textContent = '저장 중...';
  statusEl.className = 'status-msg';
  const patch = {
    subscription_status: status,
    subscription_started_at: startedVal ? new Date(startedVal + 'T00:00:00Z').toISOString() : null,
    subscription_expires_at: expiresVal ? new Date(expiresVal + 'T00:00:00Z').toISOString() : null,
    subscription_note: note || null,
  };
  // changeUserRole과 같은 이유로 .select()를 붙여서 0행 변경(=RLS에 막힘)을 놓치지 않는다.
  const { data, error } = await sb.from('profiles').update(patch).eq('id', uid).select();
  if (error) { statusEl.textContent = '저장 실패: ' + error.message; statusEl.className = 'status-msg error'; return; }
  if (!data || data.length === 0) { statusEl.textContent = '변경되지 않았습니다 (권한이 없어 막혔을 수 있습니다).'; statusEl.className = 'status-msg error'; return; }
  const idx = lastSearchedUsers.findIndex((r) => r.out_id === uid);
  if (idx !== -1) {
    lastSearchedUsers[idx] = {
      ...lastSearchedUsers[idx],
      out_subscription_status: patch.subscription_status,
      out_subscription_started_at: patch.subscription_started_at,
      out_subscription_expires_at: patch.subscription_expires_at,
      out_subscription_note: patch.subscription_note,
    };
  }
  statusEl.textContent = '저장 완료.';
  statusEl.className = 'status-msg ok';
  renderUserResults();
}

document.getElementById('user-search-btn').addEventListener('click', searchUsers);
document.getElementById('user-search-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchUsers(); });
document.getElementById('sub-only-filter').addEventListener('change', renderUserResults);

checkAccess();
</script>
